{% extends "settings/settings_base.html" %}

{% load static %}

{% block title %}Privacy settings — Sodia{% endblock %}

{% block page_name %}Privacy settings{% endblock %}

{% block head %}
    {{ block.super }}
    <script type="module" src="{% static 'js/settings/privacy.js' %}"></script>
{% endblock %}

{% block settings %}
    <form id="privacy" action="{% url 'api:settings:privacy' %}" method="post">
        {{ privacy_form }}
        <input type="submit" value="Save">
    </form>
{% endblock %}
