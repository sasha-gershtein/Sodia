{% extends "settings/settings_base.html" %}

{% load static %}

{% block title %}Notifications settings — Sodia{% endblock %}

{% block page_name %}Notifications settings{% endblock %}

{% block head %}
    {{ block.super }}
    <script type="module" src="{% static 'js/settings/notifications.js' %}"></script>
{% endblock %}

{% block settings %}
    <form id="notifications" action="{% url 'api:settings:notifications' %}" method="post">
        {{ notifications_form }}
        <input type="submit" value="Save">
    </form>
{% endblock %}
