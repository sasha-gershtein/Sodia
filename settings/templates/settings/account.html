{% extends "settings/settings_base.html" %}

{% block title %}Account settings — Sodia{% endblock %}

{% block page_name %}Account settings{% endblock %}

{% block settings %}
    <form method="POST" action="{% url 'api:users:change_password' %}">
        <h2>Change password:</h2>
        {{ change_password_form }}
        <input type="submit" value="Change password">
    </form>
    <form method="POST" action="{% url 'api:settings:account.save' %}">
        <h2>Account settings:</h2>
        {{ account_form }}
        <input type="submit" value="Save">
    </form>
{% endblock %}
