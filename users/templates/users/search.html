{% extends 'users/auth_base.html' %}

{% load static %}

{% block head %}
    {{ block.super }}
    <script type="module" src="{% static 'js/users/search.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/users/search.css' %}">
{% endblock %}

{% block title %}Search — Sodia{% endblock %}

{% block content %}
    <h1>Search</h1>
    <form id="search-form" action="{% url 'api:users:search' %}" method="post">
        {{ search_form }}
        <input type="submit" value="Search" id="search-btn">
    </form>
    <div id="search-results-container">
        <div id="no-results" hidden><p>Your search returned no results. Please check your query and try again.</p></div>
        <div id="loading-search-results" hidden><p>Loading...</p></div>
        <div id="search-results"></div>
    </div>
{% endblock %}
